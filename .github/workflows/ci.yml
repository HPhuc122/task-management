name: Build and test

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_DB: task_management_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d task_management_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
      rabbitmq:
        image: rabbitmq:4.1-management@sha256:19c5ee40801d36eaa46020c9e2ff802c4ef7e74839a00b0f8bd43f935f845778
        env:
          RABBITMQ_DEFAULT_USER: task_test
          RABBITMQ_DEFAULT_PASS: rabbit_test_only
          RABBITMQ_DEFAULT_VHOST: notifications_ci
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
        ports:
          - 1025:1025
          - 8025:8025
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: task_management_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password_only
      RUN_DATABASE_TESTS: 'true'
      RUN_ATTACHMENT_TESTS: 'true'
      S3_ENDPOINT: http://localhost:19000
      RUN_NOTIFICATION_TESTS: 'true'
      NOTIFICATIONS_ENABLED: 'false'
      RABBITMQ_HOST: localhost
      RABBITMQ_USER: task_test
      RABBITMQ_PASSWORD: rabbit_test_only
      RABBITMQ_VHOST: notifications_ci
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_AUTH: 'false'
      SMTP_STARTTLS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start real MinIO for attachment tests
        run: |
          docker run -d --name attachment-ci-minio \
            -e MINIO_ROOT_USER=test-access-key -e MINIO_ROOT_PASSWORD=test-secret-key \
            -p 127.0.0.1:19000:9000 cgr.dev/chainguard/minio:latest@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8 server /data
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 \
            --connect-timeout 2 --max-time 5 http://localhost:19000/minio/health/ready
      - name: Run tests and package
        run: mvn -B verify
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.run_attempt }}
          path: target/surefire-reports/
          retention-days: 7
