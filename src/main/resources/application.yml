spring:
  application:
    name: task-management

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:task_management}
    username: ${POSTGRES_USER:task_user}
    password: ${POSTGRES_PASSWORD:task_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080
